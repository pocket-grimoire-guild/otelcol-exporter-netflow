# Isolated OCB distribution for bounded Collector and pprof qualification.
# The generated module stays under dist/testbed and replaces the exporter
# with this checkout.
dist:
  module: github.com/pocket-grimoire-guild/otelcol-exporter-netflow/integration/testbed/collector
  name: otel-netflow-testbed-collector
  description: Bounded Testbed and pprof qualification Collector
  version: 0.0.0-dev
  output_path: ./dist/testbed
receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.160.0
exporters:
  - gomod: github.com/pocket-grimoire-guild/otelcol-exporter-netflow v0.0.0
    name: netflowexporter
extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.160.0
providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.66.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.66.0
telemetry:
  gomod: go.opentelemetry.io/collector/service v0.160.0
  import: go.opentelemetry.io/collector/service/telemetry/otelconftelemetry
replaces:
  - github.com/pocket-grimoire-guild/otelcol-exporter-netflow => ../..
