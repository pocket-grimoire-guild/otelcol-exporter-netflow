# Versioned source-release consumer recipe; no local replacement.
# check-consumer.sh rewrites only a temporary copy for isolated staging.
dist:
  module: github.com/pocket-grimoire-guild/otelcol-exporter-netflow/distribution/consumer
  name: otel-netflow-collector
  description: OpenTelemetry Collector with the NetFlow exporter
  version: 0.2.0
  output_path: ./dist/ocb
receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/netflowreceiver v0.160.0
exporters:
  - gomod: github.com/pocket-grimoire-guild/otelcol-exporter-netflow v0.2.0
    name: netflowexporter
providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.66.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.66.0
telemetry:
  gomod: go.opentelemetry.io/collector/service v0.160.0
  import: go.opentelemetry.io/collector/service/telemetry/otelconftelemetry
